services:
  # PostGIS 空間資料庫
  spatial-db:
    image: postgis/postgis:16-3.4
    container_name: building_postgis
    environment:
      POSTGRES_DB: building_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  # Qdrant 向量資料庫 (RAG 知識庫用)
  vector-db:
    image: qdrant/qdrant:v1.8.0
    container_name: building_qdrant
    ports:
      - "6333:6333" # REST API & Dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgis_data:
  qdrant_data:
